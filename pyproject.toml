[project]
name = "replaykit"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "flask>=3.0",
    "playwright>=1.40",
    "anthropic>=0.40",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["replaykit"]
